AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VaidyaVaani IVR Health Assistant — SAM Infrastructure
  Provisions all AWS resources for the hackathon prototype.

# ─── Global Settings ──────────────────────────────────────────────────────────

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_OVERRIDE: !Ref AWS::Region
        NODE_ENV: production
    Architectures:
      - arm64

# ─── Parameters ───────────────────────────────────────────────────────────────

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage

  TwilioWebhookAuthToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Twilio auth token for webhook signature validation (optional for hackathon)

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region where Bedrock models are available

# ─── Resources ────────────────────────────────────────────────────────────────

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # API Gateway — Twilio webhook entry point
  # ═══════════════════════════════════════════════════════════════════════════

  VaidyaVaaniApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub vaidyavaani-api-${Stage}
      StageName: !Ref Stage
      Description: VaidyaVaani IVR webhook API for Twilio
      EndpointConfiguration:
        Type: REGIONAL
      # Twilio sends form-encoded POST bodies
      BinaryMediaTypes:
        - application/x-www-form-urlencoded

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda Functions
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Main IVR Call Handler (4 Twilio webhook routes) ---
  CallHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-call-handler-${Stage}
      Handler: dist/handlers/callHandler.handler
      CodeUri: ../src/
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          STEP_FUNCTIONS_ARN: !Ref TriageWorkflow
          BEDROCK_REGION: !Ref BedrockRegion
          TWILIO_AUTH_TOKEN: !Ref TwilioWebhookAuthToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CallsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmergencyScriptsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StdCodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref MobileCirclesTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt TriageWorkflow.Name
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/us.amazon.nova-pro-v1:0
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.nova-micro-v1:0
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
      Events:
        IncomingCall:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /incoming
            Method: POST
        GatherResponse:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /gather
            Method: POST
        CallStatus:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /status
            Method: POST
        MissedCall:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /missed-call
            Method: POST

  # --- Hospital Dashboard API (3 routes) ---
  HospitalDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-hospital-dashboard-${Stage}
      Handler: dist/handlers/hospitalDashboard.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmergencyNotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EmergencyAcceptancesTable
      Events:
        NotifyHospitals:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /hospital/notify
            Method: POST
        AcceptEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /hospital/accept
            Method: POST
        PollStatus:
          Type: Api
          Properties:
            RestApiId: !Ref VaidyaVaaniApi
            Path: /hospital/status
            Method: GET


  # --- SMS Lambda (Step Functions target) ---
  SendSmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-send-sms-${Stage}
      Handler: dist/lambda/sendSms.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Policies:
        - SNSPublishMessagePolicy:
            TopicArn: !Ref AlertsTopic
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'
              Condition:
                StringEquals:
                  sns:Protocol: sms

  # --- Emergency Dispatch Lambda (Step Functions target) ---
  EmergencyDispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-emergency-dispatch-${Stage}
      Handler: dist/lambda/emergencyDispatch.handler
      CodeUri: ../src/
      Timeout: 65
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmergencyNotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EmergencyAcceptancesTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'

  # --- ASHA Worker Alert Lambda (Step Functions target) ---
  ASHAAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-asha-alert-${Stage}
      Handler: dist/lambda/ashaAlert.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'

  # --- Surveillance Logger Lambda (Step Functions target) ---
  SurveillanceLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-surveillance-log-${Stage}
      Handler: dist/lambda/surveillanceLog.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallsTable

  # --- Call Logger Lambda (Step Functions target — final step) ---
  CallLoggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-call-logger-${Stage}
      Handler: dist/lambda/callLogger.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallsTable
        - S3CrudPolicy:
            BucketName: !Ref RecordingsBucket

  # --- Referral Lookup Lambda (Step Functions target) ---
  ReferralFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-referral-${Stage}
      Handler: dist/lambda/referral.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256

  # --- Follow-Up Scheduler Lambda (Step Functions target) ---
  FollowUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-follow-up-${Stage}
      Handler: dist/lambda/followUp.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          FOLLOW_UP_LAMBDA_ARN: !GetAtt FollowUpTriggerFunction.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - events:PutRule
                - events:PutTargets
                - events:RemoveTargets
                - events:DeleteRule
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/vv-fu-*

  # --- Follow-Up Trigger Lambda (EventBridge target — fires on schedule) ---
  FollowUpTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-follow-up-trigger-${Stage}
      Handler: dist/lambda/followUpTrigger.handler
      CodeUri: ../src/
      Timeout: 30
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable

  # --- Chronic Care Lambda (Step Functions target) ---
  ChronicCareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-chronic-care-${Stage}
      Handler: dist/lambda/chronicCare.handler
      CodeUri: ../src/
      Timeout: 10
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'

  # --- Disease Surveillance Batch Lambda (EventBridge cron) ---
  SurveillanceBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vaidyavaani-surveillance-batch-${Stage}
      Handler: dist/lambda/surveillanceBatch.handler
      CodeUri: ../src/
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CallsTable
        - SNSPublishMessagePolicy:
            TopicArn: !Ref AlertsTopic
      Events:
        SurveillanceCron:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Name: !Sub vaidyavaani-surveillance-cron-${Stage}
            Description: Disease surveillance batch — runs every 6 hours
            Enabled: true


  # ═══════════════════════════════════════════════════════════════════════════
  # Step Functions — Post-Triage Orchestration
  # ═══════════════════════════════════════════════════════════════════════════

  TriageWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub vaidyavaani-triage-workflow-${Stage}
      DefinitionUri: ../src/stepfunctions/triageWorkflow.json
      DefinitionSubstitutions:
        SendSmsLambdaArn: !GetAtt SendSmsFunction.Arn
        EmergencyDispatchLambdaArn: !GetAtt EmergencyDispatchFunction.Arn
        ASHAAlertLambdaArn: !GetAtt ASHAAlertFunction.Arn
        SurveillanceLogLambdaArn: !GetAtt SurveillanceLogFunction.Arn
        CallLoggerLambdaArn: !GetAtt CallLoggerFunction.Arn
        ReferralLambdaArn: !GetAtt ReferralFunction.Arn
        FollowUpLambdaArn: !GetAtt FollowUpFunction.Arn
        ChronicCareLambdaArn: !GetAtt ChronicCareFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SendSmsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EmergencyDispatchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ASHAAlertFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SurveillanceLogFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CallLoggerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ReferralFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FollowUpFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ChronicCareFunction

  # ═══════════════════════════════════════════════════════════════════════════
  # DynamoDB Tables
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Conversation State (TTL: 1 hour) ---
  ConversationStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-conversation-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: callSid
          AttributeType: S
      KeySchema:
        - AttributeName: callSid
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- Call Records (TTL: 90 days — DPDP Act compliance) ---
  CallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-calls
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: callId
          AttributeType: S
      KeySchema:
        - AttributeName: callId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- Emergency Scripts (PK: condition_id, SK: patient_category) ---
  EmergencyScriptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-emergency-scripts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: condition_id
          AttributeType: S
        - AttributeName: patient_category
          AttributeType: S
      KeySchema:
        - AttributeName: condition_id
          KeyType: HASH
        - AttributeName: patient_category
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- STD Codes (landline prefix → city/district/state) ---
  StdCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-std-codes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stdCode
          AttributeType: S
      KeySchema:
        - AttributeName: stdCode
          KeyType: HASH

  # --- Mobile Circles (mobile prefix4 → telecom circle/state) ---
  MobileCirclesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-mobile-circles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: prefix4
          AttributeType: S
      KeySchema:
        - AttributeName: prefix4
          KeyType: HASH

  # --- Emergency Notifications (hospital dashboard polling) ---
  EmergencyNotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-emergency-notifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: emergencyId
          AttributeType: S
      KeySchema:
        - AttributeName: emergencyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Emergency Acceptances (hospital accepts patient) ---
  EmergencyAcceptancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vaidyavaani-emergency-acceptances
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: acceptanceId
          AttributeType: S
      KeySchema:
        - AttributeName: acceptanceId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true


  # ═══════════════════════════════════════════════════════════════════════════
  # S3 — Call Recordings
  # ═══════════════════════════════════════════════════════════════════════════

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vaidyavaani-recordings-${AWS::AccountId}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref RecordingsKMSKey
      LifecycleConfiguration:
        Rules:
          - Id: GlacierTransition
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ═══════════════════════════════════════════════════════════════════════════
  # KMS — Encryption for recordings and PII
  # ═══════════════════════════════════════════════════════════════════════════

  RecordingsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: VaidyaVaani recordings encryption key (DPDP Act compliance)
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowLambdaEncryptDecrypt
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt CallHandlerFunctionRole.Arn
                - !GetAtt CallLoggerFunctionRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'

  RecordingsKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/vaidyavaani-recordings
      TargetKeyId: !Ref RecordingsKMSKey

  # ═══════════════════════════════════════════════════════════════════════════
  # SNS — SMS + ASHA Alerts + DHO Notifications
  # ═══════════════════════════════════════════════════════════════════════════

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub vaidyavaani-alerts-${Stage}
      DisplayName: VaidyaVaani Alerts

  # ═══════════════════════════════════════════════════════════════════════════
  # EventBridge — Follow-Up Trigger Permission
  # ═══════════════════════════════════════════════════════════════════════════

  # Allow EventBridge rules (dynamically created by FollowUpScheduler) to invoke the trigger Lambda
  FollowUpTriggerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FollowUpTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/vv-fu-*

  # ═══════════════════════════════════════════════════════════════════════════
  # Bedrock Guardrail — Nova Pro Safety Config
  # ═══════════════════════════════════════════════════════════════════════════

  BedrockGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub vaidyavaani-safety-guardrail-${Stage}
      Description: Safety guardrail for Nova Pro triage responses — blocks harmful medical advice
      BlockedInputMessaging: >
        I cannot process that request. Please describe your medical symptoms.
      BlockedOutputsMessaging: >
        I cannot provide that information. Please consult a healthcare professional.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: NONE
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: SuicideOrSelfHarm
            Definition: Any discussion of suicide, self-harm, or methods of self-injury
            Type: DENY
          - Name: IllegalDrugs
            Definition: Requests for information about illegal drug use, synthesis, or procurement
            Type: DENY

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: API Gateway URL — point Twilio webhook here
    Value: !Sub https://${VaidyaVaaniApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  IncomingCallUrl:
    Description: Twilio Voice webhook URL for incoming calls
    Value: !Sub https://${VaidyaVaaniApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/incoming

  GatherUrl:
    Description: Twilio Gather action URL
    Value: !Sub https://${VaidyaVaaniApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/gather

  StatusCallbackUrl:
    Description: Twilio StatusCallback URL
    Value: !Sub https://${VaidyaVaaniApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/status

  HospitalDashboardUrl:
    Description: Hospital dashboard API base URL
    Value: !Sub https://${VaidyaVaaniApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/hospital

  RecordingsBucketName:
    Description: S3 bucket for call recordings
    Value: !Ref RecordingsBucket

  TriageWorkflowArn:
    Description: Step Functions state machine ARN
    Value: !Ref TriageWorkflow

  AlertsTopicArn:
    Description: SNS topic ARN for alerts
    Value: !Ref AlertsTopic
