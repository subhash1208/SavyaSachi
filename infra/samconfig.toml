# VaidyaVaani SAM deployment configuration
# Usage: cd infra && sam deploy

version = 0.1

[default.deploy.parameters]
stack_name = "vaidyavaani-stack"
resolve_s3 = true
s3_prefix = "vaidyavaani-sam"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
parameter_overrides = "Stage=dev"

[default.build.parameters]
use_container = false
